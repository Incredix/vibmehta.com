<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inbox · Theory</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-body">
    <header class="site-header admin-header">
      <a class="brand" href="/admin/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>Theory</strong>
          <em>Inbox</em>
        </span>
      </a>
      <div class="header-actions">
        <span id="provider-pill" class="pill" hidden></span>
        <button type="button" id="logout-btn" class="text-btn" hidden>Sign out</button>
      </div>
    </header>

    <main id="login-view" class="admin-main">
      <section class="hero">
        <p class="eyebrow">Private</p>
        <h1>Review applications.</h1>
        <p class="lede">Sign in to see applicants, run credit, and approve or decline.</p>
      </section>
      <form id="login-form" class="login-card">
        <label>
          Password
          <input name="password" type="password" required autocomplete="current-password" />
        </label>
        <p id="login-error" class="form-error" hidden></p>
        <button type="submit">Sign in</button>
      </form>
    </main>

    <main id="inbox-view" class="admin-main inbox" hidden>
      <section class="inbox-layout">
        <div class="list-pane">
          <div class="list-head">
            <h1>Applications</h1>
            <p id="list-meta" class="hint"></p>
          </div>
          <div id="app-list" class="app-list"></div>
        </div>
        <div id="detail-pane" class="detail-pane">
          <p class="empty">Select an application.</p>
        </div>
      </section>
    </main>

    <script src="/admin/admin.js"></script>
  </body>
</html>
