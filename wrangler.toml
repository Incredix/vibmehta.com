name = "vibmehta-com"
main = "src/index.js"
compatibility_date = "2026-09-17"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# D1 is optional until a real database_id is pasted below.
# Create "vibmehta-applications" in Cloudflare, copy its UUID, uncomment, redeploy.
# [[d1_databases]]
# binding = "DB"
# database_name = "vibmehta-applications"
# database_id = "PASTE-D1-UUID-HERE"
# migrations_dir = "migrations"

[[routes]]
pattern = "vibmehta.com/*"
zone_name = "vibmehta.com"

[[routes]]
pattern = "www.vibmehta.com/*"
zone_name = "vibmehta.com"

[vars]
TO_EMAIL = "vibhorfall@gmail.com"
FROM_EMAIL = "applications@vibmehta.com"
SITE_NAME = "Theory"
